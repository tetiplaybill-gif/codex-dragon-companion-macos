name: Windows source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-source:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install locked source dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
      - name: Verify dependency consistency and native imports
        run: |
          python -m pip check
          python -c "import PySide6.QtCore, PySide6.QtGui, PySide6.QtWidgets, PySide6.QtNetwork, PIL, psutil, msgspec, comtypes; print('Windows dependencies import successfully')"
      - name: Isolated unit tests and offscreen Qt startup
        run: python tools/check_source_ci.py
